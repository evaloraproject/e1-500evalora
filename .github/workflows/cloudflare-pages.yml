name: Cloudflare Pages

on:
  push:
    branches: [main, deploy/evalora-pages-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evalora-pages-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Preserve the public client configuration of the existing Pages deployment.
      VITE_SUPABASE_URL: https://whlyrhpgwgxjumskshwt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_XbkRIV6HUHZZatdkL17pJA_jUk1j20o
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun --bun run build
        env:
          NITRO_PRESET: cloudflare-pages
      - name: Verify Pages output and music
        run: |
          test -f dist/_worker.js/index.js
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          grep -rl 'uM8oI4hqw8o' dist/assets >/dev/null
          grep -rFl "$VITE_SUPABASE_URL" dist/assets >/dev/null
          grep -rFl "$VITE_SUPABASE_PUBLISHABLE_KEY" dist/assets >/dev/null
          printf '%s\n' '{"name":"evalora1-500","pages_build_output_dir":"dist","compatibility_date":"2026-11-21","compatibility_flags":["nodejs_compat"]}' > dist/wrangler.json
      - uses: actions/upload-artifact@v4
        with:
          name: evalora-pages
          path: dist

  preview:
    if: github.ref == 'refs/heads/deploy/evalora-pages-preview' && vars.EVALORA_PAGES_PREVIEW == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: evalora-pages
          path: dist
      - run: mv dist/wrangler.json wrangler.json
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=evalora1-500 --branch=evalora-github-preview

  production:
    if: github.ref == 'refs/heads/main' && vars.EVALORA_PAGES_PRODUCTION == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: evalora-pages
          path: dist
      - run: mv dist/wrangler.json wrangler.json
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=evalora1-500 --branch=main
